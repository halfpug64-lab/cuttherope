<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snip &amp; Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1424; --panel: #1f2a44; --panel-2: #2b3a5e; --ink: #f4f1e8; --muted: #a9b3c9;
    --accent: #ff6fae; --accent-ink: #3a0a20; --gold: #ffe066; --line: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: 'Fredoka', system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; }
  canvas { display: block; touch-action: none; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); cursor: crosshair; }
  .hidden { display: none !important; }

  #hud { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; pointer-events: none; }
  #hud .title { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hud .title b { color: var(--gold); }
  #hud button { pointer-events: auto; }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(15,20,36,0.6); color: var(--ink); font: inherit; font-size: 18px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: rgba(15,20,36,0.85); }
  .icon-btn svg { width: 18px; height: 18px; }

  .flies { display: inline-flex; gap: 4px; }
  .fly { width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,0.15);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.2); transition: transform .25s, background .25s, box-shadow .25s; }
  .fly.on { background: radial-gradient(circle at 40% 40%, #fffbe0, var(--gold) 55%, #e0a800);
    box-shadow: 0 0 10px 3px rgba(255,224,102,0.6); transform: scale(1.15); }
  #result-stars .fly { width: 34px; height: 34px; }

  #hint { position: absolute; left: 50%; top: 58px; transform: translateX(-50%) translateY(-10px);
    background: rgba(15,20,36,0.75); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px;
    font-size: 14px; opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; white-space: nowrap;
    max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
  #hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px 16px; border-radius: 14px; background: rgba(10,14,28,0.55);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); text-align: center; }
  .overlay h1 { margin: 0; font-size: 46px; line-height: 1; letter-spacing: 0.5px; text-shadow: 0 4px 0 rgba(0,0,0,0.3); }
  .overlay h1 span { color: var(--accent); }
  .overlay p { color: var(--muted); margin: 10px 0 22px; font-size: 15px; max-width: 280px; }
  .btn { font: inherit; font-weight: 600; font-size: 18px; border: 0; border-radius: 14px; padding: 12px 26px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; box-shadow: 0 4px 0 #b93c76; margin: 5px; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b93c76; }
  .btn.ghost { background: var(--panel-2); color: var(--ink); box-shadow: 0 4px 0 #18223a; }
  .btn.small { font-size: 14px; padding: 8px 16px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; width: 100%; max-width: 320px; }
  #levels { justify-content: flex-start; }
  #levels .top { display: flex; align-items: center; width: 100%; max-width: 340px; gap: 8px; margin-bottom: 8px; }
  #levels .top h2 { flex: 1; margin: 0; font-size: 24px; text-align: left; }
  #levels .total { color: var(--gold); font-weight: 600; }
  #grid { width: 100%; max-width: 340px; overflow-y: auto; padding-bottom: 12px; }
  #grid h3 { text-align: left; margin: 14px 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; }
  #grid .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .lvl { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--ink); font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4px; padding: 0; }
  .lvl:hover:not(:disabled) { background: #3a4d7a; }
  .lvl .n { font-size: 18px; font-weight: 700; }
  .lvl .s { display: flex; gap: 2px; }
  .lvl .s i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.2); }
  .lvl .s i.on { background: var(--gold); box-shadow: 0 0 4px var(--gold); }
  .lvl.locked { opacity: 0.35; cursor: default; }

  #result-title { font-size: 40px; }
  #result-stars { display: flex; gap: 12px; justify-content: center; margin: 14px 0 6px; }
  .credit { position: absolute; bottom: 10px; font-size: 12px; color: var(--muted); opacity: 0.8; }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game" aria-label="Game board"></canvas>

    <div id="hud" class="hidden">
      <button class="icon-btn" id="btn-levels" title="Levels" aria-label="Levels">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <div class="title"><b id="lvl-num">1</b> &middot; <span id="lvl-name"></span></div>
      <div class="flies" id="hud-stars"><i class="fly"></i><i class="fly"></i><i class="fly"></i></div>
      <button class="icon-btn" id="btn-watch" title="Show me how" aria-label="Show me how">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7"/><path d="M12 17h.01"/></svg>
      </button>
      <button class="icon-btn" id="btn-restart" title="Restart (R)" aria-label="Restart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
    <div id="hint"></div>

    <div id="menu" class="overlay">
      <h1>Snip <span>&amp;</span> Drop</h1>
      <p>Pip the baby bird is hungry. Cut the ropes, swing the berry into the nest, and grab the fireflies on the way.</p>
      <button class="btn" id="btn-play">Play</button>
      <button class="btn ghost small" id="btn-mute">Sound: on</button>
      <div class="credit">24 levels &middot; swipe to cut, tap to pop and puff</div>
    </div>

    <div id="levels" class="overlay hidden">
      <div class="top">
        <button class="icon-btn" id="btn-back" title="Back" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h2>Levels</h2>
        <span class="total" id="total"></span>
      </div>
      <div id="grid"></div>
    </div>

    <div id="result" class="overlay hidden">
      <div class="panel">
        <div id="result-title">Yum!</div>
        <div id="result-stars"><i class="fly"></i><i class="fly"></i><i class="fly"></i></div>
        <p id="result-sub" style="margin:8px auto 16px"></p>
        <button class="btn" id="btn-next">Next level</button>
        <button class="btn" id="btn-done">All done!</button>
        <button class="btn ghost" id="btn-retry">Retry</button>
        <button class="btn ghost small" id="btn-res-watch">Show me how</button>
        <button class="btn ghost small" id="btn-res-levels">Levels</button>
      </div>
    </div>
  </div>
</div>
<script src="js/engine.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
</body>
</html>
